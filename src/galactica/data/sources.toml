# Corpora Galactica can fetch and ingest.
#
# Adding a public source is a data edit: the loaders and profiles already exist.
# `download_gb` is the file itself; `peak_gb` is what you need free while both
# the download and the database exist; `db_gb` is what remains afterwards.

